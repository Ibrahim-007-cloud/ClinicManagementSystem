<div class="top-info-bar text-white d-none d-lg-block">
  <div class="container d-flex justify-content-end align-items-center gap-4 py-2">
    <div class="info-item">
      <i class="bi bi-telephone-fill me-1"></i> <strong>800 123 456</strong>
    </div>
    <div class="info-item">
      <i class="bi bi-envelope-fill me-1"></i> info@lifecare.com
    </div>
    <div class="info-item">
      <i class="bi bi-clock-fill me-1"></i> Daily: 7:00am - 8:00pm
    </div>
  </div>
</div>

<header class="lifecare-navbar bg-white shadow-sm navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <span class="brand-text-main">Life<span class="brand-text-accent"><i class="bi bi-heart-pulse-fill mx-1"></i>Care</span></span>
    </a>

    <div class="d-flex align-items-center gap-4 flex-grow-1 justify-content-end">
      <nav class="lifecare-nav-links d-flex align-items-center">
        <a class="nav-btn" routerLink="/" routerLinkActive="active-btn" [routerLinkActiveOptions]="{exact: true}">Home</a>
        <a class="nav-btn" routerLink="/patients" routerLinkActive="active-btn">Patients Directory</a>
      </nav>

      <div class="header-search-wrapper d-none d-md-block">
        <input type="text" placeholder="Search registries..." class="form-control header-search-input" />
        <button class="search-submit-btn"><i class="bi bi-search"></i></button>
      </div>
    </div>
  </div>
</header>

<main class="container py-5">
  <router-outlet></router-outlet>
</main>
