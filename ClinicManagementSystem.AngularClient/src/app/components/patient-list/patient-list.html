<div class="list-container">
  <h2>Registered Clinic Patients</h2>
  <button routerLink="/patients/new" class="btn btn-primary mb-3">Register New Patient</button>

  <table class="table" *ngIf="patients.length > 0; else noData">
    <thead>
      <tr>
        <th>Full Name</th>
        <th>Age</th>
        <th>Biological Gender</th>
        <th>Contact</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of patients">
        <td>{{ p.patientName }}</td>
        <td>{{ p.age }}</td>
        <td>{{ p.gender }}</td>
        <td>{{ p.contact }}</td>
        <td>
          <button [routerLink]="['/patients/edit', p.id]" class="btn btn-warning btn-sm me-2">Edit</button>
          <button (click)="deletePatient(p.id)" class="btn btn-danger btn-sm">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noData>
    <p class="alert alert-info">No patient record profiles found in the database.</p>
  </ng-template>
</div>
